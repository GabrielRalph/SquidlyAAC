        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;

        }
        .error-overlay,
        login-page,
        open-board-editor {
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
        }

        .error-overlay {
            background: #080707cc;
            backdrop-filter: blur(10px);
            color: white;
            display: flex;
            align-items: center;
            justify-content: center;
            text-align: center;
            font-size: 1.5em;
            flex-direction: column; 
        }
        .loader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            background-color: #262625;
            transition: 0.3s ease-in opacity;
        }

        body[loaded] .loader {
            opacity: 0;
            pointer-events: none;
        }

        squidly-loader {
            width: 15vmin;
            color: white;
        }
        iframe {
            width: 100%;
            height: 100%;

            position: fixed;
            z-index: -1;
            top: 0;
            left: 0;
        }
