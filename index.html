<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://arcms.w4v.es/Assets/Supreme/stylesheet.css">
    <title>Squidly AAC</title>
    <script type="module" src="./index.js"></script>
    <link rel="icon" type="image/x-icon" href="./favicon.svg">
    <style>
        :root {
            --gray-100: rgb(245, 245, 245)
        }
        body {
            margin: 0;
            width: 100%;
            background-color: var(--gray-100);
            font-family: 'Supreme LL TT', sans-serif;
            background: #1a1a1a;
        }
        aac-home-page {
            opacity: 0;
            pointer-events: none;
        }
    </style>
</head>
<body>
    <aac-home-page></aac-home-page>
</body>
<script type = "module">
    const homePage = document.querySelector("aac-home-page");
    homePage.waitStyles().then(() => {
        setTimeout(() => {
            homePage.style.opacity = "1";
            homePage.style.pointerEvents = "all";
        }, 300);
    });

</script>
</html>
