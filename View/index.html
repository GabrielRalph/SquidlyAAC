<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Board Viewer | Squidly</title>
    <link rel="icon" type="image/x-icon" href="../favicon.svg">
    <style>
        body {
            margin: 0;
            font-family: Arial, Helvetica, sans-serif;
            background: rgb(51, 50, 50);
            font-size: 1.3vw;
        }

        aac-board,
        aac-board-preview {
            display: block;
            position: fixed;
            top: 0;
            left: 0;
            bottom: 0;
            right: 0;
            width: 100%;
            height: 100%;
        }

        body[loaded] .loader-container,
        body[preview] aac-board,
        body:not([preview]) aac-board-preview,
        body:not([loaded]) aac-board-preview,
        body:not([loaded]) aac-board {
            opacity: 0;
            pointer-events: none;
        }

        .loader-container {
            position: fixed;
            top: 0;
            left: 0;
            height: 100%;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            color: white;
        }

        .loader {
            width: 20vw;
            height: 20vw;
        }

        .loader::after {
            display: block;
            content: " ";
            height: 100%;
            padding: 2vw;
            aspect-ratio: 1;
            border-radius: 50%;
            background: #ffffff;
            --_m: conic-gradient(#0000 10%,#000),
                linear-gradient(#000 0 0) content-box;

            -webkit-mask: var(--_m);
            mask: var(--_m);
            -webkit-mask-composite: source-out;
            mask-composite: subtract;
            animation: l3 1s infinite linear;
            box-sizing: border-box;
        }
        @keyframes l3 {to{transform: rotate(1turn)}}
    </style>
</head>
<body>
    <aac-board></aac-board>
    <aac-board-preview></aac-board-preview>
    <div class = "loader-container">
        <div class="loader"></div>
    </div>
</body>

<script type = "module">
    import { setup } from "./index.js";
    setup();
</script>

</html>
